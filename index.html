<head>
    <meta charset="UTF-8">

    <title>Your Portfolio</title>
    <style>
        * {
            margin: 0; 
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #000000 50%, #000000 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ff6b35;
        }

        /* Main Content */
        .hero {
            display: flex;
            align-items: center;
            min-height: 100vh;
            padding: 0 4rem;
            gap: 4rem;
        }

        .hero-content {
            flex: 1;
            max-width: 600px;
        }

        .greeting {
            font-size: 2rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .red-dot {
            color: #ff6b35;
            font-size: 2.5rem;
        }

        .name-line {
            position: relative;
            margin-bottom: 2rem;
        }

        .name-line::before {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 60px;
            height: 3px;
            background: #ff6b35;
        }

        .title {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            line-height: 1.1;
        }

        #dynamic-text {
            color: #ff6b35;
            border-right: 3px solid #ff6b35;
            animation: blink 0.75s step-end infinite;
            transition: opacity 0.5s ease;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #ff6b35; }
        }

        .buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #ff6b35;
            color: white;
        }

        .btn-primary:hover {
            background: #e55a2b;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid #ff6b35;
        }

        .btn-secondary:hover {
            background: #ff6b35;
            transform: translateY(-2px);
        }

        /* Social Media Links */
        .social-links {
            display: flex;
            gap: 1.5rem;
            margin-top: 2rem;
            justify-content: center;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: rgba(255, 107, 53, 0.1);
            border: 2px solid #ff6b35;
            border-radius: 50%;
            color: #ff6b35;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: #ff6b35;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3);
        }

        .social-link svg {
            width: 24px;
            height: 24px;
        }

        /* Profile Image Section */
        .profile-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .profile-container {
            position: relative;
            width: 650px;
            height: 750px;
        }

        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 20px;
            position: relative;
            z-index: 2;
        }

        .background-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            height: 550px;
            border: 3px solid #ff6b35;
            border-radius: 50%;
            z-index: 1;
        }

        .arrow-left, .arrow-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            border: 2px solid #ff6b35;
            z-index: 1;
        }

        .arrow-left {
            left: -80px;
            clip-path: polygon(0 50%, 100% 0, 100% 100%);
        }

        .arrow-right {
            right: -80px;
            clip-path: polygon(0 0, 0 100%, 100% 50%);
        }

        /* Skills Section */
        .skills {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 4rem;
            border-top: 1px solid rgba(255, 107, 53, 0.3);
        }

        .skills-list {
            display: flex;
            justify-content: center;
            gap: 2rem;
            list-style: none;
            flex-wrap: wrap;
        }

        .skills-list li {
            color: white;
            font-weight: 500;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                padding: 1rem 2rem;
            }

            .hero {
                flex-direction: column;
                padding: 2rem;
                text-align: center;
                gap: 2rem;
            }

            .title {
                font-size: 2.5rem;
            }

            .buttons {
                justify-content: center;
                flex-wrap: wrap;
            }

            .profile-container {
                width: 550px;
                height: 650px;
            }

            .background-circle {
                width: 500px;
                height: 500px;
            }

            .arrow-left, .arrow-right {
                display: none;
            }

            .skills {
                padding: 1rem 2rem;
            }

            .skills-list {
                gap: 1rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .hero {
                padding: 1rem;
            }

            .title {
                font-size: 2rem;
            }

            .profile-container {
                width: 500px;
                height: 600px;
            }

            .background-circle {
                width: 450px;
                height: 450px;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-content {
            animation: fadeInUp 1s ease-out;
        }

        .profile-section {
            animation: fadeInUp 1s ease-out 0.3s both;
        }
    </style>
</head>

    <script>
        // Smooth scrolling for navigation links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });

        // Add scroll effect to header
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 100) {
                header.style.background = 'rgba(0, 0, 0, 0.98)';
            } else {
                header.style.background = 'rgba(0, 0, 0, 0.95)';
            }
        });

        // Dynamic text animation with typing effect
        const dynamicText = document.getElementById('dynamic-text');
        const titles = [
            'Full Stack Developer',
            'Backend Developer', 
            'Spring Boot Developer'
        ];
        let currentIndex = 0;
        let currentText = '';
        let isDeleting = false;
        let charIndex = 0;

        function typeText() {
            const currentTitle = titles[currentIndex];
            
            if (isDeleting) {
                // Deleting effect
                currentText = currentTitle.substring(0, charIndex - 1);
                charIndex--;
            } else {
                // Typing effect
                currentText = currentTitle.substring(0, charIndex + 1);
                charIndex++;
            }

            dynamicText.textContent = currentText;

            let typeSpeed = 100; // Speed for typing

            if (isDeleting) {
                typeSpeed = 50; // Faster deletion
            }

            if (!isDeleting && currentText === currentTitle) {
                // Pause at the end of typing
                typeSpeed = 2000;
                isDeleting = true;
            } else if (isDeleting && currentText === '') {
                // Move to next word
                isDeleting = false;
                currentIndex = (currentIndex + 1) % titles.length;
                typeSpeed = 500; // Pause before typing next word
            }

            setTimeout(typeText, typeSpeed);
        }

        // Start the typing animation
        typeText();
    </script>
